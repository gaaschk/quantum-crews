name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: quantum_crews
          POSTGRES_USER: quantum_crews
          POSTGRES_PASSWORD: quantum_crews_local_only
        ports: ["5440:5432"]
        options: --health-cmd "pg_isready -U quantum_crews" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.11.9'
          python-version: '3.12'
      - run: python3 -m unittest discover -s deploy -p 'test_*.py' -v
      - run: npm ci
      - run: npm run typecheck && npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: ./services/api/gradlew -p services/api test bootJar --no-daemon
      - run: uv sync --directory services/runtime --frozen
      - run: uv run --directory services/runtime --frozen python -m unittest -v
      - name: Build and verify deployable containers
        run: |
          python3 deploy/manage.py init --root "$RUNNER_TEMP/qc" --test
          docker compose --env-file "$RUNNER_TEMP/qc/deployment.env" -f deploy/compose.yaml up -d --build --wait --wait-timeout 300
          python3 scripts/p1_check.py http://127.0.0.1:3180
      - name: Stop disposable container stack
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/qc/deployment.env" ]; then
            docker compose --env-file "$RUNNER_TEMP/qc/deployment.env" -f deploy/compose.yaml down --volumes
          fi
