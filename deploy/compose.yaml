name: quantum-crews-deploy
services:
  postgres:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: quantum_crews
      POSTGRES_USER: quantum_crews
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantum_crews -d quantum_crews"]
      interval: 3s
      timeout: 3s
      retries: 30
  runtime:
    image: quantum-crews-runtime:${QC_RELEASE:-local}
    build:
      context: ..
      dockerfile: deploy/runtime.Dockerfile
    restart: unless-stopped
    init: true
    environment:
      QUANTUM_RUNTIME_TOKEN: ${QUANTUM_RUNTIME_TOKEN:?Set runtime token}
      QUANTUM_TEST_MODE: ${QUANTUM_TEST_MODE:-false}
      QUANTUM_ALLOW_LIVE: ${QUANTUM_ALLOW_LIVE:-false}
      SMART_ROUTER_BASE_URL: ${SMART_ROUTER_BASE_URL:-https://smart-router.kevingaasch.com}
      SMART_ROUTER_API_KEY: ${SMART_ROUTER_API_KEY:-}
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/health',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    image: quantum-crews-api:${QC_RELEASE:-local}
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    init: true
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/quantum_crews
      SPRING_DATASOURCE_USERNAME: qc_app
      SPRING_DATASOURCE_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD}
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/quantum_crews
      SPRING_FLYWAY_USER: quantum_crews
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      QUANTUM_RUNTIME_URL: http://runtime:8200
      QUANTUM_RUNTIME_TOKEN: ${QUANTUM_RUNTIME_TOKEN:?Set runtime token}
      QUANTUM_TEST_MODE: ${QUANTUM_TEST_MODE:-false}
      QUANTUM_ALLOW_LIVE: ${QUANTUM_ALLOW_LIVE:-false}
      QUANTUM_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://127.0.0.1:3180}
      QUANTUM_COOKIE_NAME: qc_deployed_session
      QUANTUM_SECURE_COOKIES: ${QUANTUM_SECURE_COOKIES:-false}
    depends_on:
      postgres: {condition: service_healthy}
      runtime: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8100; printf 'GET /api/foundation HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; head -1 <&3 | grep -q '200'"]
      interval: 5s
      timeout: 5s
      retries: 30
  web:
    image: quantum-crews-web:${QC_RELEASE:-local}
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${WEB_PORT:-3180}:3000"
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/foundation').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  database:
