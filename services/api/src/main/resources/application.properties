spring.application.name=quantum-crews-api
server.address=127.0.0.1
server.port=8100
spring.datasource.url=jdbc:postgresql://127.0.0.1:5440/quantum_crews
spring.datasource.username=qc_app
spring.datasource.password=qc_app_local_only
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
quantum.runtime-url=http://127.0.0.1:8200
spring.flyway.user=quantum_crews
spring.flyway.password=quantum_crews_local_only
quantum.runtime-token=${QUANTUM_RUNTIME_TOKEN:}
quantum.test-mode=${QUANTUM_TEST_MODE:false}
quantum.allow-live=${QUANTUM_ALLOW_LIVE:false}

quantum.allowed-origins=${QUANTUM_ALLOWED_ORIGINS:http://127.0.0.1:3100,http://localhost:3100}
quantum.secure-cookies=${QUANTUM_SECURE_COOKIES:false}
quantum.cookie-name=${QUANTUM_COOKIE_NAME:qc_session}

quantum.credential-key=${QUANTUM_CREDENTIAL_KEY:}

quantum.mail-key=${QUANTUM_MAIL_KEY:}
quantum.mail-from=${QUANTUM_MAIL_FROM:}
quantum.public-origin=${PUBLIC_ORIGIN:http://127.0.0.1:3100}
quantum.public-mode=${QUANTUM_PUBLIC_MODE:false}
server.max-http-request-header-size=16KB
spring.mvc.log-request-details=false
server.tomcat.connection-timeout=15s
